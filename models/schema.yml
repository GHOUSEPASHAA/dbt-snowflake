version: 2

models:
  - name: dim_listings_cleansed
    description: dimlistings are cleansed here
    columns:

     - name: listing_id
       description: it is the primary key here
       tests:
         - unique
         - not_null

     - name: host_id
       description: hostid ref the host table here
       tests:
         - not_null
         - relationships:
             to: ref('dim_hosts_cleansed')
             field: host_id

     - name: room_type
       description: type of room apartment 
       tests:
         - accepted_values:
             values: ['Entire home/apt',
                      'Private room',
                      'Shared room',
                      'Hotel room']
     - name: minimum_nights
       description: dim_listings_cleansed__minimum_nights
       tests:
        - positive_value

  - name: dim_listings_w_hosts
    tests:
      - dbt_expectations.expect_table_row_count_to_equal_other_table:
          compare_model: source('airbnb', 'listings')


